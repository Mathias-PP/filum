<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Les polices se lient ici et non par `@import` dans app.css : l'import
         imposait au navigateur d'attendre app.css pour decouvrir la feuille
         Google, puis la feuille Google pour decouvrir les fichiers de police.
         Le preconnect ouvre la connexion pendant que le CSS arrive.
         Source Serif ne demande plus la graisse 400, qu'aucun element
         n'utilise : les titres sont a 500, 600 pour h2, 700 pour h1. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <meta
      name="description"
      content="Infrastructure ouverte de provenance et de filiation pour le contenu numérique"
    />
    <script>
      // Apply theme before first paint to avoid FOUC.
      (function () {
        try {
          var t = localStorage.getItem('filum-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
      // Le hero a un repli SVG, servi par le rendu serveur pour le sans-JavaScript,
      // le mouvement reduit et l'echec de chargement du module WebGL. Hors de ces
      // cas il ne doit jamais etre peint : le voir s'afficher puis ceder la place
      // au rendu 3D revenait a montrer deux illustrations differentes a la suite.
      // Pose avant la premiere peinture, donc sans le clignotement qu'aurait eu
      // un masquage decide a l'hydratation.
      (function () {
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('hero-webgl');
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
