name: CI

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Trivy vulnerability scanner
        # Pin SHA (= v0.36.0) : un tag est mutable, un SHA non.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4.37.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for secrets in code
        if: github.event_name == 'pull_request'
        # Pin SHA (= v3.95.9) : @main exécuterait n'importe quel commit upstream.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          # Fixtures HTML captures depuis des sites tiers (Frontiers) contiennent
          # des cles publiques (Google Analytics, Maps) embedded dans leur JS.
          # Ce ne sont pas nos secrets. Exclu du scan.
          #
          # `--exclude-detectors=Lob` : le motif d'une cle de test Lob est
          # `test_` suivi de 35 caracteres — soit n'importe quel nom de test un
          # peu long, et il se declare « verifie » puisque l'API Lob accepte
          # toute cle de test. Un simple nom de fonction de test a bloque cette
          # CI le 2026-08-07 (PR #323). Philum n'utilise pas Lob : rien de reel
          # n'est perdu, et le scan cesse de punir des noms de tests explicites.
          extra_args: --exclude-paths=.trufflehogignore --exclude-detectors=Lob

  # Les tests tournent sous SQLite via `Base.metadata.create_all` : aucune
  # migration Alembic n'y est jamais executee. Une migration cassee n'etait
  # donc decouverte qu'au demarrage du backend en production, ou l'echec fait
  # rollback de la transaction DDL et boucle au redemarrage. Ce job la joue sur
  # un vrai Postgres, avec pgvector, avant qu'elle n'y arrive.
  migrations-backend:
    name: Migrations Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filum
          POSTGRES_PASSWORD: filum
          POSTGRES_DB: filum_migrations
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Minuscules : `case_sensitive=True` dans pydantic-settings (ADR-010).
      database_url: postgresql+asyncpg://filum:filum@localhost:5432/filum_migrations
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras
        working-directory: apps/backend

      - name: Upgrade head
        run: uv run alembic upgrade head
        working-directory: apps/backend
        timeout-minutes: 5

      # Une migration qui monte mais ne redescend pas condamne tout retour en
      # arriere. Le cycle complet verifie que le `downgrade` est ecrit.
      - name: Downgrade puis re-upgrade
        run: uv run alembic downgrade -1 && uv run alembic upgrade head
        working-directory: apps/backend
        timeout-minutes: 5

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras
        working-directory: apps/backend

      - name: Run ruff check
        run: uv run ruff check app/
        working-directory: apps/backend
        timeout-minutes: 2

      - name: Check ruff format
        run: uv run ruff format --check app/
        working-directory: apps/backend

  typecheck-backend:
    name: Type Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras
        working-directory: apps/backend

      - name: Run mypy
        run: uv run mypy app/ --ignore-missing-imports
        working-directory: apps/backend
        timeout-minutes: 3

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Run ESLint
        run: pnpm run lint
        working-directory: apps/frontend

      - name: Check Prettier format
        run: pnpm run format --check
        working-directory: apps/frontend

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    env:
      database_url: sqlite+aiosqlite:///./test.db
      session_secret: test-secret-for-ci-session-32chars
      master_encryption_key: test-key-for-ci-encryption-32b
      ci: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras
        working-directory: apps/backend

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short
        working-directory: apps/backend

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: apps/backend/.pytest_cache
          retention-days: 7

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync
        working-directory: apps/frontend

      - name: Run tests
        run: pnpm run test --run
        working-directory: apps/frontend

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Type check
        run: pnpm run check
        working-directory: apps/frontend

      - name: Build
        run: pnpm run build
        working-directory: apps/frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: apps/frontend/build
          retention-days: 1

  dbt-check:
    name: Analytics Check
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ':memory:'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dbt
        run: pip install -r requirements.txt
        working-directory: apps/analytics

      - name: Compile dbt
        run: dbt compile --target ci
        working-directory: apps/analytics

      # Le cron 6h (analytics.yml) faisait tourner `dbt test`, mais une PR
      # cassant un test ne le voyait qu'apres merge. Un modele avec une
      # assertion `not_null` violee arrivait sur main et n'etait remarque qu'a
      # la prochaine execution planifiee. La CI PR l'attrape maintenant.
      - name: Run dbt tests
        run: dbt test --target ci
        working-directory: apps/analytics

  # Le contrat API vit dans deux fichiers commités : `apps/backend/openapi.json`
  # (sortie de FastAPI, source de vérité) et `apps/frontend/src/lib/api/
  # generated.ts` (types TypeScript dérivés). Un endpoint modifié dans le code
  # sans régénération de ces deux fichiers ne casse rien au moment du commit,
  # puis le premier appel touche une signature inexistante et l'erreur remonte
  # en prod. Ce job les régénère et refuse tout drift.
  #
  # Le test `test_openapi_sync.py` fait la même chose côté backend seul (drift
  # code Python vs openapi.json) ; ce job ajoute la vérification frontend.
  contract-api-sync:
    name: Contract API Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        run: uv sync --all-extras
        working-directory: apps/backend

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/frontend/package.json

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/frontend

      - name: Regenerate openapi.json
        run: uv run python -m app.scripts.export_openapi
        working-directory: apps/backend

      - name: Regenerate generated.ts
        run: pnpm run generate:api
        working-directory: apps/frontend

      # openapi-typescript produit un TS non-prettier ; le job Lint Frontend
      # échouerait sur ce fichier régénéré au commit suivant. On applique
      # prettier tout de suite : c'est la forme committée à comparer.
      - name: Normaliser generated.ts avec prettier
        run: pnpm exec prettier --write src/lib/api/generated.ts
        working-directory: apps/frontend

      - name: Refuser tout drift
        run: |
          if ! git diff --exit-code apps/backend/openapi.json apps/frontend/src/lib/api/generated.ts; then
            echo ""
            echo "::error::Contract API désynchronisé. Régénérer localement :"
            echo "::error::  cd apps/backend && uv run python -m app.scripts.export_openapi"
            echo "::error::  cd apps/frontend && pnpm run generate:api"
            echo "::error::puis commiter openapi.json et generated.ts ensemble."
            exit 1
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [security-scan, lint-backend, typecheck-backend, lint-frontend, test-backend, test-frontend, build-frontend, contract-api-sync]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Results"
          echo "### Security Scan: ${{ needs.security-scan.result }}"
          echo "### Backend Lint: ${{ needs.lint-backend.result }}"
          echo "### Backend Type Check: ${{ needs.typecheck-backend.result }}"
          echo "### Frontend Lint: ${{ needs.lint-frontend.result }}"
          echo "### Backend Tests: ${{ needs.test-backend.result }}"
          echo "### Frontend Tests: ${{ needs.test-frontend.result }}"
          echo "### Frontend Build: ${{ needs.build-frontend.result }}"
          echo "### Contract API Sync: ${{ needs.contract-api-sync.result }}"
