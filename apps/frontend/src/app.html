<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Infrastructure ouverte de provenance et de filiation pour le contenu numérique"
    />
    <script>
      // Apply theme before first paint to avoid FOUC.
      (function () {
        try {
          var t = localStorage.getItem('filum-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
      // Le hero a un repli SVG, servi par le rendu serveur pour le sans-JavaScript,
      // le mouvement reduit et l'echec de chargement du module WebGL. Hors de ces
      // cas il ne doit jamais etre peint : le voir s'afficher puis ceder la place
      // au rendu 3D revenait a montrer deux illustrations differentes a la suite.
      // Pose avant la premiere peinture, donc sans le clignotement qu'aurait eu
      // un masquage decide a l'hydratation.
      (function () {
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.documentElement.classList.add('hero-webgl');
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
