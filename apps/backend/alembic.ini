[alembic]
script_location = alembic
# `env.py` importe `app.core.config`. Sans cette ligne, l'import ne tient qu'a
# ce que l'environnement place deja `apps/backend` sur le sys.path (image
# Docker, editable install). Sur un runner CI nu, il echoue.
prepend_sys_path = .
# sqlalchemy.url is set programmatically in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt = %Y-%m-%d %H:%M:%S
