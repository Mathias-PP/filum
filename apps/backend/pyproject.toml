[project]
name = "filum-backend"
version = "0.1.0"
description = "Filum - Provenance and lineage infrastructure for digital content"
readme = "../../README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=50.0.0",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pillow>=12.3.0",
    "fastmcp>=3.4.4",
    # Sous-titres YouTube. YouTube fait tourner la signature des URLs de
    # pistes de sous-titres ; yt-dlp suit ces rotations, une implementation
    # maison casserait a chaque changement.
    "yt-dlp>=2026.7.4",
    # Le XML rendu par GROBID derive d'un PDF fourni par l'utilisateur : c'est
    # une entree non fiable, et `xml.etree` de la stdlib reste vulnerable a
    # l'expansion d'entites (« billion laughs »). defusedxml est la reponse
    # standard, sans dependance transitive.
    "defusedxml>=0.7.1",
    # Texte d'un PDF depose, quand la page ne rend rien (cinq URLs sur dix,
    # mesure du 2026-08-08). Pur Python, sans dependance systeme : la VM est
    # une e2-micro d'un gigaoctet, un binding compile n'y tient pas. Les
    # .docx et .odt sont lus sans dependance (zipfile + defusedxml).
    "pypdf>=6.0.0",
    # Type SQLAlchemy `vector` et operateurs de distance de pgvector. Pur
    # Python, aucune extension compilee : ce sont les bindings officiels, et
    # les ecrire a la main reviendrait a recopier un UserDefinedType et les
    # trois operateurs de distance sans rien y gagner.
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "httpx>=0.28.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "passlib[bcrypt]>=1.7.4",
    "bandit>=1.7.0",
    "safety>=3.0.0",
]
analytics = [
    "duckdb>=1.5.0",
    "dbt-duckdb>=1.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Le snapshot gelé du template ICM est du contenu embarqué, pas notre code :
# il ne doit ni être linté ni être reformaté (il est copié tel quel dans le
# workspace de chaque créateur).
exclude = ["app/agent_workspace_seed"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "B008",  # FastAPI Depends() in defaults
    "UP042", # str+Enum instead of StrEnum
]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Config `coverage.py` (via pytest-cov, deja dans les dev deps).
# `--cov` n'est PAS ajoute a `addopts` : instrumenter le code ralentit chaque
# run local (~+15 %). On l'active a la demande (`pytest --cov=app`) ou par la
# CI, jamais par defaut en dev.
[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    # Scripts one-shot (seed, reindex ponctuel) : le code y vit mais n'est
    # pas cense etre exerce par les tests. Les inclure fait mecaniquement
    # chuter le chiffre global sans dire quoi que ce soit sur la sante du
    # produit.
    "app/scripts/*",
    # Entry point FastAPI : la couverture y est faite indirectement par les
    # tests d'integration ; l'y compter explicitement double-compte.
    "app/main.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 0
# `if TYPE_CHECKING:` ou `if __name__ == "__main__":` ne sont pas du code a
# tester ; les exclure evite les faux « missing ».
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
